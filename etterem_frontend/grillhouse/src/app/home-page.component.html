<app-navbar (reserveRequested)="openReserveModal()"></app-navbar>

<main class="home-page">
  <section id="top">
    <app-hero></app-hero>
  </section>

  <section id="about" class="gh-section">
    <app-about></app-about>
  </section>

  <section id="menu" class="gh-section">
    <app-menu-preview></app-menu-preview>
  </section>

  <section id="location" class="gh-section">
    <app-visit-us></app-visit-us>
  </section>

  <app-footer></app-footer>
</main>

@if (showReserveModal) {
  <div class="home-reserve-backdrop" (click)="closeReserveModal()">
    <section class="home-reserve-modal" (click)="$event.stopPropagation()">
      <div class="home-reserve-modal__accent"></div>
      <header class="home-reserve-modal__header">
        <div>
          <h3>Asztalfoglalás</h3>
          <p>Foglalj asztalt néhány kattintással</p>
        </div>
        <button type="button" class="gh-btn gh-btn--ghost gh-btn--sm" (click)="closeReserveModal()">✕</button>
      </header>

      <div class="home-reserve-modal__body">
        <app-reserve-page [embeddedMode]="true" (closeRequested)="closeReserveModal()"></app-reserve-page>
      </div>
    </section>
  </div>
}
