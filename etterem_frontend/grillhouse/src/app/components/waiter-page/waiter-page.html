<div class="waiter-shell">
  <header class="panel-top">
    <div>
      <div class="panel-brand">
        <span class="panel-brand__icon">
          <img src="../../../assets/images/logo1024A.png" alt="">
        </span>
        <span class="panel-brand__text">GRILLHOUSE</span>
      </div>
      <div class="panel-subtitle">Pincér felület</div>
    </div>

    <div class="panel-top__right">
      <div class="gh-pill">Bejelentkezve: <b>{{ auth.user?.name }}</b></div>
      @if (auth.isOnShift) {
        <button type="button" class="gh-btn gh-btn--ghost" (click)="onEndShift()">Munka leadása</button>
      }
      <button class="gh-btn gh-btn--ghost" (click)="onLogout()">Kijelentkezés</button>
    </div>
  </header>

  <nav class="waiter-nav">
    <div class="gh-container waiter-nav__list">
      <a
        routerLink="/waiter/dashboard"
        [class.waiter-nav__link--active]="isActive('/dashboard')"
        class="waiter-nav__link"
      >
        Asztalok
      </a>
      <a
        routerLink="/waiter/reservations"
        [class.waiter-nav__link--active]="isActive('/reservations')"
        class="waiter-nav__link"
      >
        Mai foglalások
      </a>
    </div>
  </nav>

  <main class="gh-container panel-page">
    <router-outlet></router-outlet>
  </main>
</div>
