<div class="gh-container">
  <div class="visit-card">
    <div class="visit-grid">
      <div class="visit-copy">
        <h2 class="visit-title">Éttermünk</h2>

        <div class="visit-info">
          <div class="visit-row">
            <div class="visit-row__icon">📍</div>
            <div>
              <div class="visit-row__title">Helyszín</div>
        
              <div class="visit-row__value">Al Haram</div>
              <div class="visit-row__value">Giza Governorate 3512201, Egyiptom</div>
            </div>
          </div>

          <div class="visit-row">
            <div class="visit-row__icon">🕒</div>
            <div>
              <div class="visit-row__title">Nyitvatartás</div>
              <div class="visit-row__value">H-Cs: 11:00 - 20:00</div>
              <div class="visit-row__value">P-Szo: 11:00 - 23:00</div>
              <div class="visit-row__value">Vasárnap: 12:00 - 21:00</div>
            </div>
          </div>

          <div class="visit-row">
            <div class="visit-row__icon">📞</div>
            <div>
              <div class="visit-row__title">Kapcsolat</div>
              <div class="visit-row__value">06 20 123 4567</div>
              <div class="visit-row__value">info@grillhouse.com</div>
            </div>
          </div>
        </div>

        <div class="directionsDiv">

          <button class="gh-btn gh-btn--primary" (click)="onGetDirections()">
            Útvonalak
          </button>
        </div>

        <ng-container *ngIf="showDirectionsModal">
          <div class="gh-modal-overlay" (click)="closeDirectionsModal()">
            <div class="gh-modal" (click)="$event.stopPropagation()">
              <div class="panel-head">
                <h3>Válaszd ki a kívánt utazási módot</h3>
                <p class="muted">Válaszd ki a kívánt utazási módot, és megnyitjuk Google Maps-en.</p>
              </div>

              <div class="modal-body-row" style="flex-direction: column;">
                <button class="gh-btn gh-btn--primary gh-btn--block" (click)="selectTravelMode('driving')">
                  Autóval
                </button>
                <button class="gh-btn gh-btn--primary gh-btn--block" (click)="selectTravelMode('walking')">
                  Gyalog
                </button>
                <button class="gh-btn gh-btn--primary gh-btn--block" (click)="selectTravelMode('transit')">
                  Tömegközlekedéssel
                </button>
              </div>

              <div style="margin-top: 18px; text-align: right;">
                <button class="gh-btn gh-btn--ghost" (click)="closeDirectionsModal()">
                  Mégse
                </button>
              </div>
            </div>
          </div>
        </ng-container>
      </div>

      <div class="visit-media">
        <div
          class="visit-image"
          style="background-image: url('assets/images/hero-1.jpg')"
          role="img"
          aria-label="Restaurant interior"
        ></div>
      </div>
    </div>
  </div>
</div>
