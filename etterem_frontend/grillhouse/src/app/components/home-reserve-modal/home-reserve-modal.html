@if (visible) {
  <div class="home-reserve-backdrop" (click)="requestClose()">
    <section class="home-reserve-modal" (click)="$event.stopPropagation()">
      <div class="home-reserve-modal__accent"></div>
      <header class="home-reserve-modal__header">
        <div>
          <h3>{{ currentLanguage === 'hu' ? 'Asztalfoglalás' : 'Table Reservation' }}</h3>
          <p>{{ currentLanguage === 'hu' ? 'Foglalj asztalt néhány kattintással' : 'Book a table in a few clicks' }}</p>
        </div>
        <button type="button" class="gh-btn gh-btn--ghost gh-btn--sm" (click)="requestClose()">✕</button>
      </header>

      <div class="home-reserve-modal__body">
        <app-reserve-page [embeddedMode]="true" (closeRequested)="requestClose()"></app-reserve-page>
      </div>
    </section>
  </div>
}
