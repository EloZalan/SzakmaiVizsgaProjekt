<div class="admin-shell">
  <header class="panel-top">
    <div>
      <div class="panel-brand">
        <span class="panel-brand__icon">
          <img src="../../../assets/images/logo1024A.png" alt="">
        </span>
        <span class="panel-brand__text">GRILLHOUSE</span>
      </div>
      <div class="panel-subtitle">Admin felület</div>
    </div>

    <div class="panel-top__right">
      <div class="gh-pill">Bejelentkezve: <b>{{ auth.user?.name }}</b></div>
      <button class="gh-btn gh-btn--ghost" (click)="onLogout()">Logout</button>
    </div>
  </header>

  <nav class="admin-nav">
    <div class="gh-container admin-nav__list">
      <a
        routerLink="/admin/stats"
        [class.admin-nav__link--active]="isActive('/stats')"
        class="admin-nav__link"
      >
        Statisztikák
      </a>
      <a
        routerLink="/admin/staff"
        [class.admin-nav__link--active]="isActive('/staff')"
        class="admin-nav__link"
      >
        Pincérek
      </a>
      <a
        routerLink="/admin/tables"
        [class.admin-nav__link--active]="isActive('/tables')"
        class="admin-nav__link"
      >
        Asztalok
      </a>
      <a
        routerLink="/admin/menu"
        [class.admin-nav__link--active]="isActive('/menu')"
        class="admin-nav__link"
      >
        Menü
      </a>
    </div>
  </nav>

  <main class="gh-container panel-page">
    <router-outlet></router-outlet>
  </main>
</div>
