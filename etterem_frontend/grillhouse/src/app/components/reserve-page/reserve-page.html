<div class="reserve-shell">
  <div class="reserve-card">
    <h1 class="reserve-title">Asztalfoglalás</h1>
    <p class="reserve-subtitle">Foglalj asztalt néhány kattintással</p>

    <div class="reserve-form">
      <label class="reserve-field">
        <span>Név</span>
        <input [(ngModel)]="name" placeholder="Kiss Pista"/>
      </label>

      <label class="reserve-field">
        <span>Telefonszám</span>
        <input [(ngModel)]="phoneNumber" placeholder="+36301234567" />
      </label>

      <label class="reserve-field">
        <span>Dátum</span>
        <input [(ngModel)]="date" type="date" [min]="minDate" (ngModelChange)="onDateChange()" />
      </label>

      <label class="reserve-field">
        <span>Időpont</span>
        <select [(ngModel)]="time">
          @for (slot of availableTimes; track slot) {
            <option [value]="slot">{{ slot }}</option>
          }
        </select>
      </label>

      <label class="reserve-field">
        <span>Vendégek száma</span>
        <input [(ngModel)]="guests" type="number" min="1" placeholder="4" />
      </label>

      <label class="reserve-field">
        <span>Megjegyzés (opcionális)</span>
        <textarea [(ngModel)]="note" rows="3" placeholder="Pl. születésnap, allergia, különleges kérés..."></textarea>
      </label>

      @if (availableTimes.length === 0) {
        <p class="error-text">Erre a napra már nincs foglalható idősáv. Válassz másik dátumot.</p>
      }

      <button class="gh-btn gh-btn--primary gh-btn--block" (click)="submitReservation()" [disabled]="submitting || availableTimes.length === 0">
        {{ submitting ? 'Küldés...' : 'Foglalás elküldése' }}
      </button>
    </div>
  </div>

  @if (showResultModal) {
    <div class="gh-modal-overlay" (click)="closeResultModal()">
      <div class="gh-modal" (click)="$event.stopPropagation()">
        <div class="panel-head">
          <h3>{{ resultTitle }}</h3>
        </div>

        <div class="gh-panel__body">
          <div class="modal-body-row">
            <p class="muted">{{ resultMessage }}</p>

            <div class="action-row action-row--end">
              @if (isResultSuccess) {
                <button type="button" class="gh-btn gh-btn--primary" (click)="backToHome()">Vissza a főoldalra</button>
              } @else {
                <button type="button" class="gh-btn gh-btn--ghost" (click)="closeResultModal()">Bezár</button>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  }
</div>
