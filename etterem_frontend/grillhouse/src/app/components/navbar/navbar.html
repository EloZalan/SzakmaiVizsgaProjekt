<header class="nav-shell" [class.nav-shell--scrolled]="scrolled">
  <div class="gh-container nav-inner">
    <a class="nav-brand" (click)="scrollToSection('top')">
      <span class="nav-brand__icon">
             <img src="../../../assets/images/logo1024A.png" alt="">
      </span>
      <span class="nav-brand__text">GRILLHOUSE</span>
    </a>

    <nav class="nav-links">
      <a (click)="scrollToSection('menu')">{{ currentLanguage === 'hu' ? 'Menü' : 'Menu' }}</a>
      <a (click)="scrollToSection('about')">{{ currentLanguage === 'hu' ? 'Rólunk' : 'About' }}</a>
      <a (click)="scrollToSection('location')">{{ currentLanguage === 'hu' ? 'Helyszín' : 'Location' }}</a>
    </nav>

    <div class="nav-actions">
      <button class="gh-btn gh-btn--ghost" (click)="toggleLanguage()" title="Toggle language">
        <mat-icon>{{ languageService.currentLanguageValue === 'hu' ? 'language' : 'language' }}</mat-icon>
        <span>{{ languageService.currentLanguageValue === 'hu' ? 'EN' : 'HU' }}</span>
      </button>
      <button class="gh-btn gh-btn--ghost" (click)="toggleTheme()" title="Toggle theme">
        <mat-icon>{{ currentTheme === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
        <span>{{ currentTheme === 'dark' ? (currentLanguage === 'hu' ? 'Világos mód' : 'Light Mode') : (currentLanguage === 'hu' ? 'Sötét mód' : 'Dark Mode') }}</span>
      </button>
      <a class="gh-btn gh-btn--ghost btn-login" [routerLink]="[homeActionRoute]">{{ homeActionLabel }}</a>
      <a class="gh-btn gh-btn--primary" [routerLink]="['/reserve']">{{ currentLanguage === 'hu' ? 'Asztalfoglalás' : 'Reserve Table' }}</a>
    </div>
  </div>
</header>
