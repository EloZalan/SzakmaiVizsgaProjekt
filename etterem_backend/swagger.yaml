openapi: 3.0.3
info:
  title: Etterem API
  version: 1.1.0
  description: |
    Aktuális OpenAPI leírás a routes/api.php alapján.
    A védett endpointok Bearer tokennel (Sanctum) hívhatók.

servers:
  - url: http://localhost:8000/api
    description: Local Laravel API

tags:
  - name: Auth
  - name: Reservations
  - name: Tables
  - name: Menu Categories
  - name: Menu Items
  - name: Orders
  - name: Admin

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  parameters:
    ReservationId:
      name: reservation
      in: path
      required: true
      schema:
        type: integer
    TableId:
      name: table
      in: path
      required: true
      schema:
        type: integer
    OrderId:
      name: order
      in: path
      required: true
      schema:
        type: integer
    OrderItemId:
      name: orderItem
      in: path
      required: true
      schema:
        type: integer
    MenuCategoryId:
      name: menu_category
      in: path
      required: true
      schema:
        type: integer
    MenuItemId:
      name: menu_item
      in: path
      required: true
      schema:
        type: integer
    WaiterId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    Message:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, waiter]
        on_shift:
          type: boolean

    Reservation:
      type: object
      properties:
        id:
          type: integer
        table_id:
          type: integer
        guest_name:
          type: string
        phone_number:
          type: string
          nullable: true
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        guest_count:
          type: integer
        note:
          type: string
          nullable: true

    Table:
      type: object
      properties:
        id:
          type: integer
        capacity:
          type: integer
        status:
          type: string
        waiter_name:
          type: string
          nullable: true
        reservation:
          $ref: '#/components/schemas/Reservation'

    MenuCategory:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        name_hu:
          type: string
        name_en:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        name_hu:
          type: string
        name_en:
          type: string
        description:
          type: string
          nullable: true
        price:
          type: integer
        category_id:
          type: integer
          nullable: true
        image_url:
          type: string
          nullable: true

    TableOrderItem:
      type: object
      properties:
        id:
          type: integer
        menu_item_id:
          type: integer
        name:
          type: string
          nullable: true
        price:
          type: integer
          nullable: true
        quantity:
          type: integer
        line_total:
          type: integer
          nullable: true

    TableOrderDetails:
      type: object
      properties:
        order_id:
          type: integer
        table_id:
          type: integer
        reservation_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [in_progress, ready_to_pay, done]
        total_price:
          type: integer
        opened_at:
          type: string
          format: date-time
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/TableOrderItem'

    PaymentResponse:
      type: object
      properties:
        payment_id:
          type: integer
        order_status:
          type: string
          example: done
        table:
          type: object
          properties:
            id:
              type: integer
            status:
              type: string

    DailyReservationOrderItem:
      type: object
      properties:
        id:
          type: integer
        menu_item_id:
          type: integer
        name:
          type: string
        price:
          type: integer
        quantity:
          type: integer
        line_total:
          type: integer

    DailyReservationOrder:
      type: object
      properties:
        order_id:
          type: integer
        status:
          type: string
          enum: [in_progress, ready_to_pay, done]
        opened_at:
          type: string
          format: date-time
          nullable: true
        total_price:
          type: integer
        paid_total:
          type: integer
          nullable: true
        display_total:
          type: integer
        tip_amount:
          type: integer
        payment_method:
          type: string
          nullable: true
          enum: [cash, card, null]
        items:
          type: array
          items:
            $ref: '#/components/schemas/DailyReservationOrderItem'

    DailyReservation:
      type: object
      properties:
        reservation_id:
          type: integer
        table_id:
          type: integer
        table_capacity:
          type: integer
          nullable: true
        guest_name:
          type: string
        guest_count:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
          nullable: true
        note:
          type: string
          nullable: true
        order:
          allOf:
            - $ref: '#/components/schemas/DailyReservationOrder'
          nullable: true

paths:
  /login:
    post:
      tags: [Auth]
      summary: Bejelentkezés
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Sikeres bejelentkezés
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Hibás adatok

  /user:
    get:
      tags: [Auth]
      summary: Aktuális felhasználó
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Felhasználó
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Auth]
      summary: Felhasználó frissítése
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Frissített felhasználó

  /take-shift:
    post:
      tags: [Auth]
      summary: Műszak felvétele (pincér)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Műszak aktív

  /end-shift:
    post:
      tags: [Auth]
      summary: Műszak leadása (pincér)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Műszak inaktív

  /logout:
    post:
      tags: [Auth]
      summary: Kijelentkezés
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Sikeres kijelentkeztetés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /reservations:
    get:
      tags: [Reservations]
      summary: Foglalások listázása (műszakban lévő pincér)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Foglalások
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reservation'
    post:
      tags: [Reservations]
      summary: Új előzetes foglalás létrehozása (publikus)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guest_name, phone_number, guest_count, start_time]
              properties:
                guest_name:
                  type: string
                phone_number:
                  type: string
                guest_count:
                  type: integer
                  minimum: 1
                start_time:
                  type: string
                  format: date-time
                note:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Foglalás létrehozva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '422':
          description: Validáció vagy asztal elérhetőség hiba

  /reservations/walk-in:
    post:
      tags: [Reservations]
      summary: Walk-in foglalás létrehozása (műszakban lévő pincér)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guest_count]
              properties:
                guest_count:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Foglalás létrehozva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'

  /reservations/today-with-orders:
    get:
      tags: [Reservations]
      summary: Mai foglalások rendeléssel együtt (műszakban lévő pincér)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Napi foglalások
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyReservation'

  /reservations/{reservation}:
    get:
      tags: [Reservations]
      summary: Foglalás lekérése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '200':
          description: Foglalás
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
    put:
      tags: [Reservations]
      summary: Foglalás módosítása
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guest_name:
                  type: string
                phone_number:
                  type: string
                guest_count:
                  type: integer
                  minimum: 1
                start_time:
                  type: string
                  format: date-time
                note:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Foglalás módosítva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
    delete:
      tags: [Reservations]
      summary: Foglalás törlése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReservationId'
      responses:
        '204':
          description: Sikeres törlés

  /tables/max-capacity:
    get:
      tags: [Tables]
      summary: Legnagyobb asztalkapacitás (publikus)
      responses:
        '200':
          description: Max kapacitás
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_capacity:
                    type: integer

  /tables:
    get:
      tags: [Tables]
      summary: Asztalok listázása (műszakban lévő pincér)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Asztalok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'

  /tables/{table}:
    get:
      tags: [Tables]
      summary: Asztal részletei
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: Asztal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'

  /tables/{table}/orders:
    post:
      tags: [Orders]
      summary: Rendelés nyitása az asztalhoz
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '201':
          description: Rendelés létrehozva
        '400':
          description: Nincs érvényes foglalás vagy már van rendelés
    get:
      tags: [Orders]
      summary: Aktuális rendelés lekérése az asztalhoz
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: Rendelés adatok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableOrderDetails'

  /orders/{order}/items:
    post:
      tags: [Orders]
      summary: Tétel hozzáadása rendeléshez
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [menu_item_id, quantity]
              properties:
                menu_item_id:
                  type: integer
                quantity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Tétel hozzáadva

  /orders/{order}/items/{orderItem}:
    delete:
      tags: [Orders]
      summary: Tétel törlése rendelésből
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/OrderItemId'
      responses:
        '200':
          description: Tétel törölve

  /orders/{order}/simulate-ready:
    post:
      tags: [Orders]
      summary: Rendelés fizetésre készre állítása
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 'Új státusz: ready_to_pay'

  /orders/{order}/pay:
    post:
      tags: [Orders]
      summary: Fizetés rögzítése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method]
              properties:
                payment_method:
                  type: string
                  enum: [cash, card]
                tip:
                  type: integer
                  minimum: 0
                  nullable: true
      responses:
        '200':
          description: Fizetés rögzítve
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

  /menu-categories:
    get:
      tags: [Menu Categories]
      summary: Menü kategóriák listázása (publikus)
      responses:
        '200':
          description: Kategóriák
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuCategory'

  /menu-categories/{menu_category}:
    get:
      tags: [Menu Categories]
      summary: Menü kategória lekérése (publikus)
      parameters:
        - $ref: '#/components/parameters/MenuCategoryId'
      responses:
        '200':
          description: Kategória
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategory'

  /menu-items:
    get:
      tags: [Menu Items]
      summary: Menü tételek listázása (publikus)
      responses:
        '200':
          description: Menü tételek
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'

  /menu-items/{menu_item}:
    get:
      tags: [Menu Items]
      summary: Menü tétel lekérése (publikus)
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '200':
          description: Menü tétel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'

  /admin/waiters:
    get:
      tags: [Admin]
      summary: Pincérek listázása
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Waiter lista
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Admin]
      summary: Pincér létrehozása
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '201':
          description: Pincér létrehozva

  /admin/waiters/{id}:
    delete:
      tags: [Admin]
      summary: Pincér törlése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WaiterId'
      responses:
        '204':
          description: Törölve

  /admin/daily-revenue:
    get:
      tags: [Admin]
      summary: Mai bevétel (borravaló nélkül)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Napi bevétel
          content:
            application/json:
              schema:
                type: object
                properties:
                  daily_revenue:
                    type: integer

  /admin/today-guests:
    get:
      tags: [Admin]
      summary: Mai vendégszám
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Mai vendégek száma
          content:
            application/json:
              schema:
                type: object
                properties:
                  today_guests:
                    type: integer

  /admin/guest-count-history:
    get:
      tags: [Admin]
      summary: Vendégforgalom előzmények
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Napi vendégszám adatok
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    date:
                      type: string
                      format: date
                    guest_count:
                      type: integer

  /admin/tables:
    get:
      tags: [Admin]
      summary: Asztalok listázása adminnak
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Asztalok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Table'
    post:
      tags: [Admin]
      summary: Asztal létrehozása
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacity]
              properties:
                capacity:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Asztal létrehozva

  /admin/tables/{table}:
    put:
      tags: [Admin]
      summary: Asztal módosítása
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capacity]
              properties:
                capacity:
                  type: integer
                  minimum: 1
      responses:
        '200':
          description: Asztal módosítva
    delete:
      tags: [Admin]
      summary: Asztal törlése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '204':
          description: Asztal törölve

  /admin/tables/{table}/reset-to-free:
    post:
      tags: [Admin]
      summary: Asztal visszaállítása szabadra
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TableId'
      responses:
        '200':
          description: Sikeres visszaállítás

  /admin/menu-categories:
    post:
      tags: [Admin]
      summary: Menü kategória létrehozása
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                name_hu:
                  type: string
                name_en:
                  type: string
      responses:
        '201':
          description: Kategória létrehozva

  /admin/menu-categories/{menu_category}:
    put:
      tags: [Admin]
      summary: Menü kategória frissítése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuCategoryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                name_hu:
                  type: string
                name_en:
                  type: string
      responses:
        '200':
          description: Kategória frissítve
    delete:
      tags: [Admin]
      summary: Menü kategória törlése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuCategoryId'
      responses:
        '204':
          description: Kategória törölve

  /admin/menu-items:
    get:
      tags: [Admin]
      summary: Menü tételek listázása adminnak
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Menü tételek
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
    post:
      tags: [Admin]
      summary: Menü tétel létrehozása
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [price]
              properties:
                name:
                  type: string
                name_hu:
                  type: string
                name_en:
                  type: string
                description:
                  type: string
                price:
                  type: integer
                category_id:
                  type: integer
                  nullable: true
                image:
                  type: string
                  format: binary
                remove_image:
                  type: boolean
                source_item_id:
                  type: integer
      responses:
        '201':
          description: Menü tétel létrehozva

  /admin/menu-items/{menu_item}:
    put:
      tags: [Admin]
      summary: Menü tétel frissítése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [price]
              properties:
                name:
                  type: string
                name_hu:
                  type: string
                name_en:
                  type: string
                description:
                  type: string
                price:
                  type: integer
                category_id:
                  type: integer
                  nullable: true
                image:
                  type: string
                  format: binary
                remove_image:
                  type: boolean
      responses:
        '200':
          description: Menü tétel frissítve
    delete:
      tags: [Admin]
      summary: Menü tétel törlése
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '204':
          description: Menü tétel törölve
